name: Build Windows installer

# Produces the Tauri shell's .exe/.msi installer only — NOT the Python/RVC
# backend (that's a separate, multi-GB, GPU-specific environment set up on
# the target PC itself via setup.bat; see README).
on:
  push:
    branches: [master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app (NSIS installer)
        working-directory: frontend
        run: npm run tauri build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vertumnus-Windows-Installer
          path: frontend/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
