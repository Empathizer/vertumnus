[package]
name = "vertumnus"
version = "0.1.0"
description = "Vertumnus real-time voice changer"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "vertumnus"
path = "src/main.rs"
